name: Dong Y Evening Reminder

on:
  schedule:
    - cron: '0 14 * * *'  # 21:00 ICT (UTC+7)
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Run evening reminder
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SESSION: evening
        run: python reminder.py
      - name: Commit state changes
        run: |
          git config user.name "DongY Bot"
          git config user.email "dongy@bot.local"
          git add state.json || true
          git diff --staged --quiet || git commit -m "Update state.json [skip ci]"
          git push || true
